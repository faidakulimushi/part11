name: Periodic health check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  health_check:
    runs-on: ubuntu-latest

    steps:
      - name: Check deployed application
        uses: Jtalk/url-health-check-action@v4
        with:
          url: https://fs-pokedex-0veh.onrender.com/
          max-attempts: 3
          retry-delay: 5s